# SpotiSort live config.
# "Hindi -> Dil" and "Malayalam -> NewAgeMadrasMail" are live, both at the default 14-day threshold
# (decision 37: the test-only days_threshold: 0 override is gone now that --restore/top were proven live).
# Japanese, English and the catch-all stay disabled until reviewed.
default_days_threshold: 14
language_playlists:
  "Dil": hindi
  "The Simulation Archives": english
  "NewAgeMadrasMail": malayalam
  "nani mo wakaranai": japanese
enrichment:
  musicbrainz: true
  english_default: false
rules:
  - name: "Hindi -> Dil"
    enabled: true
    match:
      language_in: [hindi]
    target_playlist: "Dil"
  - name: "Malayalam -> NewAgeMadrasMail"
    enabled: true
    match:
      language_in: [malayalam]
    target_playlist: "NewAgeMadrasMail"
  - name: "Japanese -> nani mo wakaranai (draft)"
    enabled: false
    match:
      language_in: [japanese]
    target_playlist: "nani mo wakaranai"
  - name: "English -> The Simulation Archives (draft, weak signal)"
    enabled: false
    match:
      language_in: [english]
    target_playlist: "The Simulation Archives"
  - name: "Vault catch-all (draft, top)"
    enabled: false
    match:
      release_year_after: 1900     # catch-all: any song with a release date
    target_playlist: "Vault_drx"
    target_position: top
