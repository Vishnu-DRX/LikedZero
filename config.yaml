# LikedZero live config.
# "Hindi -> Dil" and "Malayalam -> NewAgeMadrasMail" are live, both at the default 14-day threshold, both to
# the bottom of their playlists. "English -> The Simulation Archives" and "Japanese -> nani mo wakaranai" are
# now live too (2026-09-29); English inserts at the top, Japanese at the default bottom.
# The artist_in_playlist auto-router and the real catch-all stay disabled until reviewed.
default_days_threshold: 14
language_playlists:
  "Dil": hindi
  "The Simulation Archives": english
  "NewAgeMadrasMail": malayalam
  "nani mo wakaranai": japanese
enrichment:
  musicbrainz: true
  english_default: false
# Master decisions 11/decision 54: min_tracks 3 / min_dominance 0.9 is the measured, recommended default
# (design/reports/measurement-round-2.md Task 1: 95.8% precision, 47.7% recall of the qualifying subset).
# Vault_drx is excluded here for documentation; it is also hardcoded, independent of this list
# (src/enrichment/artist_playlist.py), so it can never become an auto-routing target either way.
artist_in_playlist:
  min_tracks: 3
  min_dominance: 0.9
  exclude_playlists: ["Vault_drx"]
rules:
  - name: "Hindi -> Dil"
    enabled: true
    match:
      language_in: [hindi]
    target_playlist: "Dil"
  - name: "Malayalam -> NewAgeMadrasMail"
    enabled: true
    match:
      language_in: [malayalam]
    target_playlist: "NewAgeMadrasMail"
  # Six explicit artist rules, added 2026-09-27 per the playlist-classification audit
  # (design/reports/measurement-round-2.md): each of these playlists is already >=90% one
  # artist's tracks, confirmed live. Ordered before the drafts below since these are
  # high-confidence, narrow rules and should be tried first.
  - name: "Anavae -> Anavae binge list"
    enabled: true
    match:
      artist_in: ["Anavae"]
    target_playlist: "Anavae binge list"
  - name: "Linkin Park -> Dead Dreams' Disco"
    enabled: true
    match:
      artist_in: ["Linkin Park"]
    target_playlist: "Dead Dreams' Disco"
  - name: "Queen -> Her Highness"
    enabled: true
    match:
      artist_in: ["Queen"]
    target_playlist: "Her Highness"
  - name: "Twenty One Pilots -> Riffs in the air"
    enabled: true
    match:
      artist_in: ["Twenty One Pilots"]
    target_playlist: "Riffs in the air"
  - name: "Klasey Jones -> The Klasey Universe"
    enabled: true
    match:
      artist_in: ["Klasey Jones"]
    target_playlist: "The Klasey Universe"
  - name: "The Midnight -> Midnight Mixer"
    enabled: true
    match:
      artist_in: ["The Midnight"]
    target_playlist: "Midnight Mixer"
  # Master decisions 11/decision 54: proven (94.1-98.4% precision on the "effectively single-playlist
  # artist" subset, design/reports/measurement-round-2.md Task 1) but shipped disabled -- the master/user
  # turns it on after reviewing a dry-run with it enabled, same as every other rule that reached this config.
  - name: "Route to artist's home playlist (draft)"
    enabled: false
    match:
      artist_in_playlist: true
    target_playlist: auto
  - name: "Japanese -> nani mo wakaranai"
    enabled: true
    match:
      language_in: [japanese]
    target_playlist: "nani mo wakaranai"
  - name: "English -> The Simulation Archives"
    enabled: true
    match:
      language_in: [english]
    target_playlist: "The Simulation Archives"
    target_position: top
  # Master decisions 12/decision 51: the real catch-all (Q6), replacing the release_year_after: 1900 hack.
  # `match: {any: true}` unconditionally matches -- chosen over extending `fallback_playlist` to an object
  # because a real rule gets the full explain trace, Rules-view/shadowing treatment and target_position that
  # `fallback_playlist` structurally can't (see design/reports/phase-catch-all.md for the reasoning). Must be
  # the LAST rule so it only ever catches what nothing else, including artist_in_playlist, already claimed.
  # 2026-09-29: retargeted to "The Simulation Archives" per the user, while parameters/precision keep evolving
  # (was "SpotiSort Sink", still empty and available if the catch-all target changes again later). NOTE:
  # this makes the "English -> The Simulation Archives" rule above land in the same place either way, and
  # means language_playlists' "The Simulation Archives": english mapping will accumulate non-English songs
  # over time -- flagged to the user, not yet addressed.
  - name: "Catch-all -> The Simulation Archives"
    enabled: true
    match:
      any: true
    target_playlist: "The Simulation Archives"
    target_position: top
