default_days_threshold: 14

# Optional: tell SpotiSort which of your playlists are language playlists (playlist name -> language).
# Songs by the same artists are then recognised as that language. Names, ISO codes or native names work.
language_playlists: {}
#  "Chill Hindi": hindi
#  "Malayalam Favs": ml

enrichment:
  musicbrainz: true        # look up genre/language hints on MusicBrainz (free, 1 request/second)
  english_default: false   # weak guess (off by default): assume English for Latin-script songs by US/GB/AU/CA/IE/NZ artists

fallback_playlist: null   # or a playlist name; null = leave unmatched songs alone

rules:
  - name: "Jazz to Jazz Vault"
    enabled: true
    match:
      genre_contains: ["jazz"]
    target_playlist: "Jazz Vault"
    days_threshold: 7          # optional override of the global default

  - name: "Hindi to Hindi Vibes"
    enabled: true
    match:
      language_in: ["hindi"]      # language comes from enrichment (Phase 2), not from Spotify
    target_playlist: "Hindi Vibes"

  - name: "Favorite chill artists"
    enabled: true
    match:
      artist_in: ["Bonobo", "Tycho"]
    target_playlist: "Chillhop Favorites"

  - name: "Old hip-hop"
    enabled: true
    match:
      genre_contains: ["hip hop", "rap"]
      release_year_before: 2010
    target_playlist: "Old School Hip-Hop"

  - name: "Explicit filter example"
    enabled: true
    match:
      explicit: false
      track_name_contains: "acoustic"
    target_playlist: "Acoustic"
    create_missing_playlists: false   # default; only attach to existing

  - name: "Vault (catch-all, newest on top)"
    enabled: false
    match:
      explicit: false
    target_playlist: "The Vault"
    target_position: top              # default is bottom; top = new songs go to the top, existing order kept

