name: lighthouse

on:
  push:
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.json
          # median of 3: a single run on a shared runner swings the performance score by several points
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
