name: e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # decision 46/P2: "auto" silently skips any browser that fails to launch (it did locally: 2 passed,
      # 175 skipped, still reported "green"). CI installs all three below, so a missing one here should fail
      # the job loudly instead of quietly shrinking coverage.
      SPOTISORT_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python -m pytest tests/e2e -q -m e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots
          path: docs/screenshots/site-*.png
          if-no-files-found: ignore
