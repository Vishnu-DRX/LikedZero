name: Sync

# Scheduling (set from the Configure page, stored as `schedule:` in config.yaml). GitHub's cron lives in this
# file and cannot be changed from a web page without a token that can edit workflows, so this workflow ticks
# every 30 minutes and its first step (`python -m src.schedule`) checks the owner's own schedule -- local time in
# their timezone -- against the tick. Ticks that are not due stop right there (a few seconds). A due tick is a
# DRY RUN unless config.yaml sets `schedule.apply: true`, which config validation only allows together with
# `inbox_since` (decision 45/P1-2); the tool refuses an unattended --apply without it as a second line of
# defence, the planner never evaluates a song liked before it, and --max-moves (default 50) still caps the run.
# Manual runs are unchanged: a live one needs dry_run unticked AND the `newest` input.
# Limits: GitHub can delay a scheduled run by 5-20+ minutes (a slot stays claimable for 90 minutes), and
# disables scheduled workflows in a repo with no activity for 60 days.
#
# `vars.LIKEDZERO_CRON` (a repository *variable*, not a secret) is a legacy, informational fallback: it gates
# nothing and is only used for the dashboard Overview when config.yaml has no enabled `schedule:`.
#
# The variable still falls back to its pre-rename `SPOTISORT_CRON` name, so a fork that set it keeps working.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes). Untick only after reviewing the dashboard."
        type: boolean
        default: true
      newest:
        description: "Only touch the N newest liked songs (REQUIRED for a live run)"
        type: string
        default: ""
      max_moves:
        description: "Abort if the plan has more moves than this"
        type: string
        default: "50"

concurrency:
  group: likedzero-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
      NEWEST: ${{ inputs.newest }}
      MAX_MOVES: ${{ inputs.max_moves }}
      LIKEDZERO_CRON: ${{ vars.LIKEDZERO_CRON || vars.SPOTISORT_CRON }}
      IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Schedule gate
        id: gate
        # Non-scheduled events always run. A scheduled tick runs only when the owner's schedule in config.yaml says so.
        run: |
          set -euo pipefail
          if [ "${IS_SCHEDULE:-false}" != "true" ]; then
            { echo "run=true"; echo "apply=false"; } >> "$GITHUB_OUTPUT"
          else
            python -m src.schedule --config config.yaml --runs logs/runs.json
          fi

      # The enrichment cache is NOT committed: it lists your whole library. A unique key per run lets the cache
      # be updated; restore-keys brings back the newest earlier one.
      - name: Restore enrichment cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/enrichment.json
          key: enrichment-v1-${{ github.run_id }}
          restore-keys: |
            enrichment-v1-

      - name: Check configuration exists
        if: steps.gate.outputs.run == 'true'
        run: |
          test -f config.yaml || { echo "config.yaml is missing. Create it with the Configure page and commit it."; exit 1; }
          python -c "from src.config import load_config; load_config('config.yaml'); print('config.yaml is valid')"

      - name: Sync
        if: steps.gate.outputs.run == 'true'
        env:
          # Only this step (the one that produces logs the next step commits) marks itself as a "committed run",
          # so logging.include_track_names is honoured only for output that is actually about to be published.
          LIKEDZERO_COMMITTED_RUN: "1"
          SCHEDULE_APPLY: ${{ steps.gate.outputs.apply }}
        run: |
          set -euo pipefail
          args=(--config config.yaml --max-moves "${MAX_MOVES:-50}")
          if [ -n "${LIKEDZERO_CRON:-}" ]; then
            args+=(--cron "${LIKEDZERO_CRON}")
          fi
          if [ "${IS_SCHEDULE:-false}" = "true" ]; then
            # A due tick (see the Schedule gate) supplies no 'newest' input, so a scheduled live run uses
            # --allow-unselected instead -- which src.sync itself refuses unless config.yaml sets inbox_since, so a
            # schedule can never reach the whole legacy library. It is live only if config.yaml says schedule.apply.
            if [ "${SCHEDULE_APPLY:-false}" = "true" ]; then
              args+=(--apply --allow-unselected)
            fi
          elif [ "${DRY_RUN:-true}" != "true" ]; then
            args+=(--apply)
            [ -n "${NEWEST:-}" ] || { echo "A live run needs the 'newest' input (it never touches your whole library)."; exit 2; }
            args+=(--newest "$NEWEST")
          fi
          python -m src.sync "${args[@]}"

      - name: Prepare journal for artifact upload
        # Journal durability (decision 33, updated by decision 44/P1-4): the committed logs/YYYY-MM-DD*.json
        # log's journal/uri are now redacted before commit (a bare uri resolves to a real song in one
        # request), so --restore can no longer work from that committed file. `src.sync` writes the REAL
        # journal to the git-ignored logs/restore-journal.json instead; we upload that file as its own Actions
        # artifact so --restore still works, independent of whether the log commit-back step below succeeds.
        # NOTE: an artifact on a public repo is downloadable by any *signed-in GitHub user*, not truly private
        # (GitHub has no per-artifact ACL) -- this only narrows exposure from "the whole internet" to that.
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p logs/journal-artifact
          if [ -f logs/restore-journal.json ]; then
            cp logs/restore-journal.json logs/journal-artifact/journal.json
          else
            echo '{"journal": [], "note": "no apply run was produced this run"}' > logs/journal-artifact/journal.json
          fi

      - name: Upload journal artifact
        # Uploading a workflow artifact only needs the default GITHUB_TOKEN read/write-artifacts permission,
        # which every run has automatically; it does not need `contents: write` the way the git push below
        # does, so this step can never conflict with (or depend on) the "Commit run logs" step succeeding.
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.run_id }}
          path: logs/journal-artifact/journal.json
          retention-days: 90

      - name: Commit run logs
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "likedzero-bot"
          git config user.email "likedzero-bot@users.noreply.github.com"
          shopt -s nullglob
          files=(logs/runs.json logs/latest-plan.json logs/20*.json)
          existing=()
          for f in "${files[@]}"; do [ -f "$f" ] && existing+=("$f"); done
          if [ "${#existing[@]}" -gt 0 ]; then git add -f "${existing[@]}"; fi
          if git diff --cached --quiet; then
            echo "no log changes"
          else
            git commit -m "Update run logs [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
