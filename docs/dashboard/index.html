<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>try{var t=localStorage.getItem('likedzero-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="LikedZero dashboard: see what your sorter will do, what it did, and whether it is safe. Read-only." />
    <meta name="theme-color" content="#121212" />
    <title>LikedZero dashboard</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <link rel="stylesheet" href="../assets/tokens.css" />
    <link rel="stylesheet" href="../assets/components.css" />
    <link rel="stylesheet" href="../assets/site.css" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div id="site-shell">
      <noscript>
        <p><a href="../index.html">LikedZero</a> ·
           <a href="../builder/">Configure</a> ·
           <a href="./">Dashboard</a> ·
           <a href="../setup/">Setup guide</a> ·
           <a href="https://github.com/Vishnu-DRX/LikedZero">GitHub</a></p>
      </noscript>
    </div>

    <main id="main" class="wrap">
      <div class="page-title">
        <h1>Dashboard</h1>
        <p>Read-only. Nothing here can change your Spotify library.</p>
      </div>

      <div class="mode-bar">
        <label class="switch">
          <input type="checkbox" class="switch-input" id="mode-toggle" role="switch" aria-checked="false" />
          <span class="switch-ui" aria-hidden="true"></span>
          <span class="switch-label" id="mode-toggle-label">Detailed mode</span>
        </label>
        <button type="button" class="btn btn-secondary btn-sm" id="glossary-btn" data-open="glossary-drawer">Glossary</button>
      </div>
      <div class="banner" id="mode-callout" role="status" hidden>
        <span class="ico" aria-hidden="true">&#9432;</span>
        <div class="mode-callout-body">
          <p>Prefer more detail? <button type="button" class="btn btn-secondary btn-sm" id="mode-callout-switch">Switch to Detailed</button></p>
        </div>
        <button type="button" class="btn btn-icon" id="mode-callout-dismiss" aria-label="Dismiss this tip">&#10005;</button>
      </div>

      <p class="source-current" id="source-current" data-testid="source-current" role="status"></p>

      <form class="source-bar" id="source-bar" aria-label="Data source" onsubmit="return false">
        <div class="field">
          <label for="source-select">Data source</label>
          <select id="source-select" class="select">
            <option value="repo">Repo (your fork on GitHub)</option>
            <option value="fixtures">Demo data</option>
            <option value="files">Open local files</option>
          </select>
        </div>
        <div class="field grow" id="repo-field" hidden>
          <label for="repo-url">Raw GitHub folder URL</label>
          <input id="repo-url" class="input" type="text" inputmode="url" autocomplete="off" spellcheck="false" aria-describedby="repo-hint" />
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="repo-save" hidden>Save URL</button>
        <button type="button" class="btn btn-secondary btn-sm" id="reload-btn">Reload data</button>
        <p class="source-note" id="repo-hint" role="status"></p>
        <div class="field grow" id="files-field" hidden>
          <label id="files-drop-label" for="files-input">
            Drop your <code>logs</code> folder's files here, or choose files. Nothing is uploaded — everything is read in this browser only.
            This is the only source that ever shows real song titles from a public fork.
          </label>
          <div id="files-drop" class="files-drop" tabindex="0" role="button" aria-labelledby="files-drop-label">
            <input id="files-input" class="input" type="file" accept="application/json,.json" multiple />
          </div>
          <p class="source-note" id="files-status" role="status" data-testid="files-status"></p>
        </div>
      </form>

      <!-- Tabs and the view-root skeleton below are pre-rendered here (not just injected by app.js) so the very
           first paint already has them at roughly their final size. app.js overwrites both with equivalent,
           data-driven markup once it runs; without this static version, the elements start at zero height and
           only reach full size after JS executes, which is a large, measured layout shift (CLS) on first load. -->
      <nav class="tabs" aria-label="Dashboard views">
        <ul id="tabs">
          <li><a href="#/overview" aria-current="page">Overview</a></li>
          <li><a href="#/inbox">Inbox</a></li>
          <li><a href="#/rules">Rules</a></li>
          <li><a href="#/playlists">Playlists</a></li>
          <li><a href="#/runs">Runs</a></li>
          <li><a href="#/safety">Safety</a></li>
          <li><a href="#/signals">Signals</a></li>
          <li><a href="#/backtest">Backtest</a></li>
        </ul>
      </nav>

      <div id="view-root" tabindex="-1" aria-busy="true">
        <p class="sr-only" role="status">Loading data…</p>
        <!-- decision 42: Simple is the default, and its real Overview has 4 KPI cards (not 7), so this
             zero-JS first-paint skeleton is sized for the common case to avoid a CLS jump for most visitors. -->
        <div aria-hidden="true">
          <span class="skeleton-line short"></span>
          <div class="grid">
            <div class="card"><span class="skeleton-line short"></span><span class="skeleton-line" style="height:1.75rem;width:60%"></span><span class="skeleton-line"></span></div>
            <div class="card"><span class="skeleton-line short"></span><span class="skeleton-line" style="height:1.75rem;width:60%"></span><span class="skeleton-line"></span></div>
            <div class="card"><span class="skeleton-line short"></span><span class="skeleton-line" style="height:1.75rem;width:60%"></span><span class="skeleton-line"></span></div>
            <div class="card"><span class="skeleton-line short"></span><span class="skeleton-line" style="height:1.75rem;width:60%"></span><span class="skeleton-line"></span></div>
          </div>
          <span class="skeleton-line"></span><span class="skeleton-line short"></span>
        </div>
      </div>
    </main>

    <div id="drawer-root" class="overlay overlay-side" hidden></div>

    <div class="overlay" id="run-now-dialog" hidden>
      <div class="dialog" role="dialog" aria-labelledby="run-now-title">
        <div class="dialog-head">
          <h2 id="run-now-title">Run now</h2>
          <button type="button" class="btn btn-icon" data-close aria-label="Close">&#10005;</button>
        </div>
        <div class="dialog-body" id="run-now-body">
          <p class="small muted">Loading…</p>
        </div>
      </div>
    </div>

    <div class="overlay overlay-side" id="glossary-drawer" hidden>
      <aside class="drawer" role="dialog" aria-labelledby="glossary-title">
        <div class="dialog-head">
          <h2 id="glossary-title">Glossary</h2>
          <button type="button" class="btn btn-icon" data-close aria-label="Close glossary">&#10005;</button>
        </div>
        <div class="dialog-body" id="glossary-body"></div>
      </aside>
    </div>

    <script src="../assets/ui.js"></script>
    <script src="../assets/shell.js" data-active="dashboard"></script>
    <script src="../assets/github-pat.js"></script>
    <script src="data.js"></script>
    <script src="views.js"></script>
    <script src="run-now.js"></script>
    <script src="app.js"></script>
  </body>
</html>
